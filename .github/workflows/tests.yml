name: Run tests

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          # Install your package in editable mode (uses pyproject.toml or setup.py)
          pip install -e .
          # Ensure test/runtime deps exist (safe even if already installed)
          pip install pytest pandas numpy

      - name: Run pytest
        run: |
          pytest -q
          